name: Build AI pack

# Run by hand (Actions tab -> Build AI pack -> Run workflow). Public repos don't use Actions minutes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag for this pack"
        default: "pack-1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Make disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Add swap (extra memory on disk)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 20G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -m; df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          pip install --no-cache-dir torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir diffusers==0.30.3 transformers==4.44.2 peft==0.12.0 accelerate==0.34.2 \
            huggingface_hub==0.24.7 onnx==1.16.2 onnxruntime==1.19.2 numpy==1.26.4 pillow safetensors

      - name: Build the pack
        run: |
          ( while true; do echo "MEM $(date +%H:%M:%S) $(free -m | awk '/Mem/{print "used="$3"MB avail="$7"MB"} /Swap/{print "swap="$3"MB"}' | tr '\n' ' ') DISK $(df -h / | awk 'NR==2{print $4}') free"; sleep 30; done ) &
          python build_pack.py export
          python build_pack.py finish

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" pack/* --title "SCP Media AI pack ($TAG)" \
            --notes "AI models for SCP Media's on-phone outfit editor. The app downloads these itself. Licences: LICENSES.md."
